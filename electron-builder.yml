appId: com.nodebook.app
productName: Nodebook
directories:
  buildResources: build
# Ad-hoc signs unsigned macOS builds so arm64 isn't rejected as "damaged".
afterPack: build/afterPack.cjs
files:
  # electron-builder also includes package.json and production dependencies.
  - 'out/main/**'
  - 'out/preload/**'
  - 'out/renderer/**'
  - 'LICENSE'
# Native addons (better-sqlite3) must live outside the asar so their .node
# binaries can be dlopen'd at runtime. sqlite-vec ships a loadable extension
# (.dylib/.so/.dll, not .node) that's likewise dlopen'd, so unpack it too.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/sqlite-vec*/**'
mac:
  category: public.app-category.productivity
  # afterPack applies the ad-hoc signature used for GitHub releases.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  target:
    - nsis
    - portable
linux:
  category: Utility
  target:
    - AppImage
    - deb
deb:
  # Append to electron-builder's default dependencies.
  fpm:
    - --depends
    - libgbm1
    - --depends
    - 'libasound2t64 | libasound2'
# The release workflow stages and verifies the GitHub Release draft.
publish:
  provider: github
