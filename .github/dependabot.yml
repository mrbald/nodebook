version: 2
updates:
  # Weekly npm version updates.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      # Keep the noise down: batch routine minor/patch bumps into one PR.
      minor-and-patch:
        update-types: [minor, patch]
  # Keep the GitHub Actions in the workflows current too.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
