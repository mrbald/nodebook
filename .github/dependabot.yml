version: 2
updates:
  # Check each morning, including weekends.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: cron
      cronjob: '0 5 * * *'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      # Keep the noise down: batch routine minor/patch bumps into one PR.
      minor-and-patch:
        update-types: [minor, patch]
  # Keep the GitHub Actions in the workflows current too.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: cron
      cronjob: '0 5 * * *'
    cooldown:
      default-days: 5
  - package-ecosystem: pre-commit
    directory: '/'
    schedule:
      interval: cron
      cronjob: '0 5 * * *'
    cooldown:
      default-days: 5
