name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    if: &native_required >-
      ${{ github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           (github.event.pull_request.user.login == 'dependabot[bot]' ||
            startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'deps/'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            mac_arch: arm64
            runner_arch: ARM64
            macho_arch: arm64
          - os: macos-15-intel
            mac_arch: x64
            runner_arch: X64
            macho_arch: x86_64
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Read release version and verify tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Typecheck and unit tests
        run: npm run typecheck && npm test
      - run: npm run build
      - name: Build ad-hoc signed macOS distribution files
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.mac_arch }}
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          # The afterPack hook ad-hoc signs the app before packaging.
          npx --no-install electron-builder --mac dmg zip "--$MAC_ARCH" --publish never \
            -c.dmg.writeUpdateInfo=false \
            '-c.mac.artifactName=${productName}-${version}-${arch}.${ext}'
      - name: Verify and smoke test macOS distribution files
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.mac_arch }}
          MACHO_ARCH: ${{ matrix.macho_arch }}
        run: |
          base="dist/Nodebook-$RELEASE_VERSION-$MAC_ARCH"
          dmg="$base.dmg"
          zip="$base.zip"
          test -s "$dmg"
          test -s "$zip"
          verify_and_smoke() {
            local app="$1"
            local binary="$app/Contents/MacOS/Nodebook"
            codesign --verify --deep --strict --verbose=2 "$app"
            local signature
            signature=$(LC_ALL=C codesign --display --verbose=4 "$app" 2>&1)
            grep -Fxq 'Signature=adhoc' <<< "$signature"
            test "$(lipo -archs "$binary")" = "$MACHO_ARCH"
            NODEBOOK_SMOKE_BINARY="$binary" npx --no-install playwright test e2e/talk.spec.ts
          }

          hdiutil verify "$dmg"

          scratch=$(mktemp -d)
          mount="$scratch/mount"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount" >/dev/null || return
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          mkdir "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          mounted=true
          ditto "$mount/Nodebook.app" "$scratch/dmg/Nodebook.app"
          hdiutil detach "$mount"
          mounted=false
          verify_and_smoke "$scratch/dmg/Nodebook.app"

          ditto -x -k "$zip" "$scratch/zip"
          verify_and_smoke "$scratch/zip/Nodebook.app"
      - name: Build Windows or Linux distribution files
        if: runner.os != 'macOS'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ github.event_name == 'push' && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          if [[ "$RUNNER_OS" == Windows && -n "$WIN_CSC_LINK" ]]; then
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            npx --no-install electron-builder --publish never \
              '-c.nsis.artifactName=${productName}-${version}-setup.${ext}' \
              '-c.portable.artifactName=${productName}-${version}-portable.${ext}'
          else
            npx --no-install electron-builder --publish never
          fi
      - name: Check the Debian runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # An empty dpkg status file prevents runner-installed libraries from hiding missing dependencies.
          status="$RUNNER_TEMP/empty-dpkg-status"
          plan="$RUNNER_TEMP/nodebook-apt-plan"
          : > "$status"
          sudo apt-get -o Acquire::Retries=3 update -qq
          LC_ALL=C apt-get -s -o "Dir::State::status=$status" --no-install-recommends \
            install "./dist/nodebook_${RELEASE_VERSION}_amd64.deb" > "$plan"
          grep -E '^Inst libgbm1(:amd64)? ' "$plan"
          grep -E '^Inst libasound2(t64)?(:amd64)? ' "$plan"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  native-readiness:
    name: Native package readiness
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify packaging result
        env:
          REQUIRED: *native_required
          RESULT: ${{ needs.build.result }}
        run: |
          case "$REQUIRED:$RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::Native builds required=$REQUIRED, result=$RESULT"; exit 1 ;;
          esac

  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Create and verify the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob dotglob
          mac=()
          for arch in arm64 x64; do
            for extension in dmg zip; do
              asset="assets/Nodebook-${GITHUB_REF_NAME#v}-$arch.$extension"
              mac+=("$asset")
            done
          done
          windows=(
            "assets/Nodebook-${GITHUB_REF_NAME#v}-setup.exe"
            "assets/Nodebook-${GITHUB_REF_NAME#v}-portable.exe"
          )
          appimages=(assets/*.AppImage)
          debs=(assets/*.deb)
          test "${#appimages[@]}" = 1
          test "${#debs[@]}" = 1
          files=("${mac[@]}" "${windows[@]}" "${appimages[@]}" "${debs[@]}")
          for asset in "${files[@]}"; do
            test -s "$asset"
          done

          state=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -r --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | .draft')
          case "$state" in
            '')
              notes="$RUNNER_TEMP/release-notes.md"
              cat > "$notes" <<'NOTES'
          ## Install on macOS

          Requires macOS 13 (Ventura) or later.

          1. Download the `arm64` DMG for Apple silicon or the `x64` DMG for Intel.
          2. Open the DMG, drag Nodebook to Applications, then open it from Applications.
          3. Nodebook is ad-hoc signed and Apple has not notarized it. If macOS says it can't verify Nodebook, dismiss the alert. In **System Settings → Privacy & Security**, click **Open Anyway** for Nodebook and confirm. macOS remembers the exception for that copy.

          Use this exception only for a copy you trust from this release. If macOS reports that the app is damaged or will harm your computer, stop. [Apple’s first-launch instructions](https://support.apple.com/en-us/102445)
          NOTES
              gh release create "$GITHUB_REF_NAME" "${files[@]}" \
                --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" --generate-notes
              ;;
            true) ;;
            *)
              echo "::error::The tag already has a public release or multiple releases"
              exit 1
              ;;
          esac
          gh release download "$GITHUB_REF_NAME" --pattern '*' --dir downloaded
          downloaded=(downloaded/*)
          test "${#downloaded[@]}" = "${#files[@]}"
          for asset in "${files[@]}"; do
            cmp "$asset" "downloaded/${asset##*/}"
          done
