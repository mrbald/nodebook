name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # postinstall runs `electron-builder install-app-deps`. Since better-sqlite3
      # 13 it rebuilds nothing — that module ships Node-API prebuilds, so one
      # binary serves both Node and Electron. Kept as the guard that would build
      # a future native dep against the Electron ABI the e2e app runs on.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The Electron e2e drives a real window, so it needs a virtual display and
      # Chromium's shared libraries (Electron links the same set).
      - run: npx playwright install-deps chromium
      - run: xvfb-run --auto-servernum npm run test:e2e
